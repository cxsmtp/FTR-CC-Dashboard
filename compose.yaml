# podman compose up -d   (or docker compose). Change the host port on the left of "7443".
services:
  command-center:
    build: .
    image: ftr-cc-dashboard:latest
    restart: unless-stopped
    ports:
      - "7443:7443"
    env_file: .env
    environment:
      BACKUP_DIR: /backups
    volumes:
      - ftr-cc-data:/data
      - ftr-cc-backups:/backups
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
volumes:
  ftr-cc-data:
  ftr-cc-backups:
