services:
  command-center:
    build: .
    image: ftr-cc-dashboard:latest
    restart: unless-stopped
    ports:
      - "443:8443"
      - "80:8443"
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - cc-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
volumes:
  cc-data:
