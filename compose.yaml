# podman compose up -d   (or docker compose). Change the host port on the left of "7443".
services:
  command-center:
    build: .
    image: ftr-cc-dashboard:latest
    restart: unless-stopped
    ports:
      # Bound to every interface of the host on purpose (people reach it over the network); put an address in front,
      # like "10.0.0.5:7443:7443", to take it to one interface only.
      - "0.0.0.0:7443:7443"
    env_file: .env
    environment:
      BACKUP_DIR: /backups
    volumes:
      - ftr-cc-data:/data
      - ftr-cc-backups:/backups
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "node", "scripts/healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
volumes:
  ftr-cc-data:
  ftr-cc-backups:
