# The container image, published to ghcr.io on every v* tag (and as :latest), so it runs with two commands:
#   podman pull ghcr.io/cxsmtp/ftr-cc-dashboard:latest
#   podman run -d --name ftr-cc -p 7443:7443 -v ftr-cc-data:/data ... ghcr.io/cxsmtp/ftr-cc-dashboard:latest
name: container
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ftr-cc-dashboard:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/ftr-cc-dashboard:latest
