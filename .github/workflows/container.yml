# The container image, published to ghcr.io on every v* tag (and as :latest), so it runs with two commands:
#   podman pull ghcr.io/cxsmtp/ftr-cc-dashboard:latest
#   podman run -d --name ftr-cc -p 7443:7443 -v ftr-cc-data:/data ... ghcr.io/cxsmtp/ftr-cc-dashboard:latest
name: container
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Containerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ftr-cc-dashboard:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/ftr-cc-dashboard:latest
