# A release the command center installs from Settings → Updates (and by itself, every 15 minutes): the app with its
# production dependencies and MANIFEST.json (every file's SHA-256), and SHA256SUMS, attached to the GitHub release.
# Published by itself whenever main carries a version (package.json) that has no release yet, or on a v* tag.
name: release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      promote:
        description: 'Promote a candidate to a full release (its tag, e.g. v1.101.0): production installations then take it'
        required: false
        default: ''
permissions:
  contents: write
  # Signing: the release's file list gets a GitHub build attestation (Sigstore, public log); servers check it.
  id-token: write
  attestations: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Promotion only: a candidate that ran well on staging becomes a full release; nothing is built.
      - name: Promote a candidate
        if: github.event_name == 'workflow_dispatch' && inputs.promote != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.promote }}
        run: gh release edit "$TAG" --prerelease=false --latest
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: The version, and whether it is released already
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="v$(node -p "require('./package.json').version")"
          echo "tag=$v" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$v" ]; then echo "The tag $GITHUB_REF_NAME does not match package.json ($v)"; exit 1; fi
          if gh release view "$v" >/dev/null 2>&1; then echo "exists=yes" >> "$GITHUB_OUTPUT"; echo "$v is released already."; else echo "exists=no" >> "$GITHUB_OUTPUT"; fi
      - if: steps.v.outputs.exists == 'no'
        run: npm ci
      - if: steps.v.outputs.exists == 'no'
        run: npm test
      - if: steps.v.outputs.exists == 'no'
        run: npm ci --omit=dev
      - if: steps.v.outputs.exists == 'no'
        run: node scripts/make-release.mjs dist
      - name: Sign the file list
        if: steps.v.outputs.exists == 'no'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/MANIFEST.json
      - name: Publish
        if: steps.v.outputs.exists == 'no'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          node -e "const s=require('fs').readFileSync('CHANGELOG.md','utf8');const v='CC-'+process.argv[1].slice(1).split('.').map(n=>n.padStart(2,'0')).join('.');const m=s.split(/\n(?=## )/).find(x=>x.startsWith('## '+v));require('fs').writeFileSync('notes.md',m||'See CHANGELOG.md')" "$TAG"
          PRE=""; if [ "$(node -p "require('./package.json').releaseChannel || ''")" = "candidate" ]; then PRE="--prerelease"; fi
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "CC $TAG" --notes-file notes.md $PRE
